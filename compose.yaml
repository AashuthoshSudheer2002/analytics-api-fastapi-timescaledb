

services:
  app:
    image: analytics-api:v1
    build:
       context: .
       dockerfile: Dockerfile
    # environment:
    #   - PORT=8802
    #   - DATABASE_URL=postgresql+psycopg://time-user:time-pw@db_service:5432/timescaledb
    env_file:
      - .env
    ports:
      - "8802:8802"  # map container port 8802 to host 8802
    command: uvicorn main:app --host 0.0.0.0 --port 8802 --reload
    volumes:
      - ./src:/code:rw      # live reload: changes in ./src reflect in container
    develop:
      watch:
        - action : rebuild
          path: Dockerfile
        - action : rebuild 
          path : requirements.txt
        - action : rebuild
          path : compose.yaml
        
    depends_on:
      - db_service

  db_service:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: timescaledb
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data

volumes:
  timescaledb_data: